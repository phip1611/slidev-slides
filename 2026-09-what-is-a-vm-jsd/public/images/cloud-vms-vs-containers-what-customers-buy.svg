<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'IBM Plex Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    16:9 canvas (1200x675) filled by the content with only a slight margin,
    matching the other figures on a 16:9 slide.
    Core message: container customers never rent a VM themselves, but the
    container platform dedicates one VM per customer, so the hardware-enforced
    VM boundary still separates customers from each other.
    Palette: green = VM, purple = virtualization layer, one colour per customer.
  -->
  <style>
    .title  { font-size: 26px; font-weight: 600; fill: #8a0404; letter-spacing: -0.035em; }
    .h      { font-size: 16px; font-weight: 600; fill: #242126; }
    .t      { font-size: 15px; fill: #242126; }
    .sub    { font-size: 13px; fill: #706b6d; }
    .note   { font-size: 16px; fill: #706b6d; }
    .mono   { font-family: 'Source Code Pro', monospace; font-size: 13px; fill: #242126; }
    .monos  { font-family: 'Source Code Pro', monospace; font-size: 11.5px; fill: #242126; }

    .host   { fill: #f7f7f8; stroke: #6b7280; stroke-width: 2; }
    .vm     { fill: #e9f7ef; stroke: #2f9e5b; stroke-width: 2.5; }
    .zone   { fill: none; stroke: #7c4dcc; stroke-width: 2; stroke-dasharray: 8 5; }
    .kvm    { fill: #f3ebff; stroke: #7c4dcc; stroke-width: 2; }
    .hw     { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.5; }
    .layer  { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .link   { stroke: #6b7280; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }

    /* One colour per customer: pill and workloads */
    .cA { fill: #eaf1ff; stroke: #3b6fd8; stroke-width: 2; }
    .cB { fill: #fff1d6; stroke: #d98a00; stroke-width: 2; }
    .cC { fill: #fde7f1; stroke: #c2417a; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#706b6d"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>

  <text class="title" x="40" y="46">What customers buy vs. where it actually runs</text>

  <!-- ===== Customers (centred above their VM) ===== -->
  <rect class="cA" x="160" y="72" width="150" height="52" rx="26"/>
  <text class="h" x="235" y="95" text-anchor="middle" fill="#2a56b8">Customer A</text>
  <text class="sub" x="235" y="114" text-anchor="middle">buys a VM</text>

  <rect class="cB" x="532" y="72" width="150" height="52" rx="26"/>
  <text class="h" x="607" y="95" text-anchor="middle" fill="#a86a00">Customer B</text>
  <text class="sub" x="607" y="114" text-anchor="middle">buys containers</text>

  <rect class="cC" x="890" y="72" width="150" height="52" rx="26"/>
  <text class="h" x="965" y="95" text-anchor="middle" fill="#a0305f">Customer C</text>
  <text class="sub" x="965" y="114" text-anchor="middle">buys containers</text>

  <!-- ===== Physical host ===== -->
  <rect class="host" x="40" y="150" width="1120" height="450" rx="16"/>
  <text class="h" x="60" y="176" fill="#706b6d">Physical host, operated by the cloud provider</text>

  <!-- Container platform: a tenant of the provider that resells capacity as containers -->
  <rect class="zone" x="430" y="188" width="710" height="288" rx="14"/>
  <text class="h" x="448" y="211" fill="#5b2fb0">Container platform</text>
  <text class="sub" x="640" y="211">rents one VM per customer</text>

  <!-- VM rented directly by Customer A: everything in one guest -->
  <rect class="vm" x="70" y="225" width="330" height="235" rx="12"/>
  <text class="t" x="86" y="248">VM, rented by Customer A</text>
  <rect class="cA" x="82" y="262" width="306" height="190" rx="8"/>
  <text class="sub" x="235" y="281" text-anchor="middle">A controls everything, incl. the guest kernel</text>
  <rect class="layer" x="105" y="306" width="260" height="28" rx="6"/>
  <text class="mono" x="235" y="325" text-anchor="middle">nginx</text>
  <rect class="layer" x="105" y="338" width="260" height="28" rx="6"/>
  <text class="mono" x="235" y="357" text-anchor="middle">postgres</text>
  <rect class="layer" x="105" y="370" width="260" height="28" rx="6"/>
  <text class="mono" x="235" y="389" text-anchor="middle">JRE: spring-boot service</text>
  <rect class="layer" x="90" y="408" width="290" height="36" rx="6"/>
  <text class="t" x="235" y="431" text-anchor="middle">Guest kernel (A)</text>

  <!-- Platform VMs: one per customer, never shared between customers -->
  <!-- B: 2 containers -->
  <rect class="vm" x="442" y="225" width="330" height="235" rx="12"/>
  <text class="t" x="454" y="248">Platform VM</text>
  <text class="sub" x="454" y="266">B only</text>
  <rect class="cB" x="454" y="280" width="150" height="80" rx="8"/>
  <text class="t" x="529" y="325" text-anchor="middle">B</text>
  <rect class="cB" x="610" y="280" width="150" height="80" rx="8"/>
  <text class="t" x="685" y="325" text-anchor="middle">B</text>
  <rect class="layer" x="454" y="370" width="306" height="28" rx="6"/>
  <text class="sub" x="607" y="389" text-anchor="middle">container runtime</text>
  <rect class="layer" x="454" y="408" width="306" height="36" rx="6"/>
  <text class="t" x="607" y="431" text-anchor="middle">Guest kernel (B)</text>

  <!-- C: the same stack as A, but one container per service -->
  <rect class="vm" x="800" y="225" width="330" height="235" rx="12"/>
  <text class="t" x="812" y="248">Platform VM</text>
  <text class="sub" x="812" y="266">C only</text>
  <rect class="cC" x="812" y="280" width="98" height="80" rx="8"/>
  <text class="monos" x="861" y="325" text-anchor="middle">nginx</text>
  <rect class="cC" x="916" y="280" width="98" height="80" rx="8"/>
  <text class="monos" x="965" y="325" text-anchor="middle">postgres</text>
  <rect class="cC" x="1020" y="280" width="98" height="80" rx="8"/>
  <text class="monos" x="1069" y="317" text-anchor="middle">JRE:</text>
  <text class="monos" x="1069" y="335" text-anchor="middle">spring-boot</text>
  <rect class="layer" x="812" y="370" width="306" height="28" rx="6"/>
  <text class="sub" x="965" y="389" text-anchor="middle">container runtime, one container per service</text>
  <rect class="layer" x="812" y="408" width="306" height="36" rx="6"/>
  <text class="t" x="965" y="431" text-anchor="middle">Guest kernel (C)</text>

  <!-- Virtualization + hardware, shared by every VM on the host -->
  <rect class="kvm" x="70" y="496" width="1060" height="36" rx="6"/>
  <text class="t" x="600" y="519" text-anchor="middle">Host kernel + KVM, one VMM process per VM (e.g. Cloud Hypervisor)</text>
  <rect class="hw" x="70" y="542" width="1060" height="36" rx="6"/>
  <text class="t" x="600" y="565" text-anchor="middle">Hardware: CPUs, memory, NICs, disks</text>

  <!-- What each customer bought -> the VM it lands in (drawn last to sit on top) -->
  <path class="link" d="M235,124 V223"/>
  <path class="link" d="M607,124 V223"/>
  <path class="link" d="M965,124 V223"/>

  <text class="note" x="600" y="638" text-anchor="middle">Container customers never see a VM, yet each gets one (in a typical setup): the VM boundary separates customers.</text>
</svg>
