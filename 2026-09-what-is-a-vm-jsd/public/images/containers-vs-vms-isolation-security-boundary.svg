<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'IBM Plex Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    16:9 canvas filled by the content itself (only a slight margin), so it
    scales like the other figures on a 16:9 slide.
    Two stacks on the same baseline. Boundary style = strength
    (dashed amber = kernel-enforced, thick green = hypervisor-enforced),
    box height = weight (VMs carry their own kernel),
    blue = what the customer has to take care of.
  -->
  <style>
    .title  { font-size: 28px; font-weight: 600; fill: #8a0404; letter-spacing: -0.035em; }
    .h      { font-size: 22px; font-weight: 600; fill: #242126; }
    .t      { font-size: 18px; fill: #242126; }
    .b      { font-size: 18px; font-weight: 600; }
    .sub    { font-size: 14px; fill: #706b6d; }
    .note   { font-size: 18px; fill: #706b6d; }

    .panel  { fill: #f7f7f8; stroke: #e6e1df; stroke-width: 1.5; }
    .cust   { fill: #dbe7ff; stroke: #3b6fd8; stroke-width: 2; }
    .hw     { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.5; }
    .ctr    { fill: #fffaf0; stroke: #d98a00; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .kernel { fill: #fff1d6; stroke: #d98a00; stroke-width: 2.5; }
    .vm     { fill: #e9f7ef; stroke: #2f9e5b; stroke-width: 4.5; }
    .hv     { fill: #f3ebff; stroke: #7c4dcc; stroke-width: 2.5; }
  </style>

  <rect width="1200" height="675" fill="#ffffff"/>

  <text class="title" x="40" y="52">Containers vs. VMs: who enforces isolation?</text>
  <rect class="cust" x="850" y="32" width="28" height="24" rx="4"/>
  <text class="t" x="890" y="51">Customer responsibility</text>

  <rect class="panel" x="40" y="80" width="540" height="505" rx="14"/>
  <rect class="panel" x="620" y="80" width="540" height="505" rx="14"/>

  <!-- ===== Containers ===== -->
  <text class="h" x="60" y="120">Containers</text>

  <rect class="ctr" x="60" y="285" width="235" height="135" rx="10"/>
  <rect class="cust" x="78" y="297" width="199" height="110" rx="6"/>
  <text class="t" x="177" y="358" text-anchor="middle">App</text>

  <rect class="ctr" x="325" y="285" width="235" height="135" rx="10"/>
  <rect class="cust" x="343" y="297" width="199" height="32" rx="6"/>
  <text class="t" x="442" y="319" text-anchor="middle">App 1</text>
  <rect class="cust" x="343" y="336" width="199" height="32" rx="6"/>
  <text class="t" x="442" y="358" text-anchor="middle">App 2</text>
  <rect class="cust" x="343" y="375" width="199" height="32" rx="6"/>
  <text class="t" x="442" y="397" text-anchor="middle">App 3</text>

  <rect class="kernel" x="60" y="440" width="500" height="70" rx="8"/>
  <text class="b" x="310" y="470" text-anchor="middle" fill="#a86a00">Shared host kernel (Linux)</text>
  <text class="sub" x="310" y="492" text-anchor="middle">enforces the boundary in software (syscalls)</text>

  <rect class="hw" x="60" y="525" width="500" height="45" rx="8"/>
  <text class="t" x="310" y="554" text-anchor="middle">Hardware</text>

  <!-- ===== VMs ===== -->
  <text class="h" x="640" y="120">Virtual machines</text>

  <rect class="vm" x="640" y="150" width="235" height="270" rx="12"/>
  <rect class="cust" x="658" y="168" width="199" height="110" rx="6"/>
  <text class="t" x="757" y="229" text-anchor="middle">App</text>
  <rect class="cust" x="658" y="292" width="199" height="110" rx="6"/>
  <text class="b" x="757" y="345" text-anchor="middle" fill="#2a56b8">Guest kernel</text>
  <text class="sub" x="757" y="370" text-anchor="middle">its own Linux</text>

  <rect class="vm" x="905" y="150" width="235" height="270" rx="12"/>
  <rect class="cust" x="923" y="168" width="199" height="32" rx="6"/>
  <text class="t" x="1022" y="190" text-anchor="middle">App 1</text>
  <rect class="cust" x="923" y="207" width="199" height="32" rx="6"/>
  <text class="t" x="1022" y="229" text-anchor="middle">App 2</text>
  <rect class="cust" x="923" y="246" width="199" height="32" rx="6"/>
  <text class="t" x="1022" y="268" text-anchor="middle">App 3</text>
  <rect class="cust" x="923" y="292" width="199" height="110" rx="6"/>
  <text class="b" x="1022" y="345" text-anchor="middle" fill="#2a56b8">Guest kernel</text>
  <text class="sub" x="1022" y="370" text-anchor="middle">its own Linux</text>

  <rect class="hv" x="640" y="440" width="500" height="70" rx="8"/>
  <text class="b" x="890" y="470" text-anchor="middle" fill="#5b2fb0">Hypervisor (Linux/KVM)</text>
  <text class="sub" x="890" y="492" text-anchor="middle">enforces the boundary with the CPU itself (VMX / SVM)</text>

  <rect class="hw" x="640" y="525" width="500" height="45" rx="8"/>
  <text class="t" x="890" y="554" text-anchor="middle">Hardware</text>

  <!-- ===== The isolation boundary, drawn where it is enforced ===== -->
  <line x1="60" y1="440" x2="560" y2="440" stroke="#d98a00" stroke-width="5" stroke-dasharray="9 6"/>

  <line x1="640" y1="440" x2="1140" y2="440" stroke="#2f9e5b" stroke-width="9"/>

  <!-- ===== Takeaways ===== -->
  <text class="note" x="310" y="612" text-anchor="middle" fill="#a86a00">Attack surface: the whole Linux syscall interface</text>
  <text class="note" x="890" y="612" text-anchor="middle" fill="#1f7a45">Attack surface: a handful of virtual devices</text>
  <text class="note" x="310" y="643" text-anchor="middle">Lightweight: just the app</text>
  <text class="note" x="890" y="643" text-anchor="middle">Heavier: app + its own kernel</text>
</svg>
