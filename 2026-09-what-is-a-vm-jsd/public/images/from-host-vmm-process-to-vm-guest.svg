<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'IBM Plex Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Reading direction is left → right: a vCPU *thread* in the VMM process calls
    ioctl(KVM_RUN); KVM switches the physical core into guest mode, and that is
    exactly what the guest perceives as one of its CPUs. Rows are aligned so each
    thread visually maps 1:1 onto a guest CPU.
  -->
  <style>
    .title   { font-size: 24px; font-weight: 600; fill: #8a0404; letter-spacing: -0.035em; }
    .h       { font-size: 17px; font-weight: 600; fill: #242126; }
    .sub     { font-size: 13px; fill: #706b6d; }
    .t       { font-size: 14px; fill: #242126; }
    .mono    { font-family: 'Source Code Pro', monospace; font-size: 13px; fill: #242126; }
    .hint    { font-size: 14px; fill: #706b6d; font-style: italic; }

    .ch      { fill: #eaf1ff; stroke: #3b6fd8; stroke-width: 2; }
    .vm      { fill: #e9f7ef; stroke: #2f9e5b; stroke-width: 2; }
    .kvm     { fill: #f3ebff; stroke: #7c4dcc; stroke-width: 2; }
    .thread  { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; }
    .vcpu    { fill: #fff1d6; stroke: #d98a00; stroke-width: 2; }
    /* "There are more of these" – same shape, faded, stacked behind */
    .ghost   { opacity: 0.35; stroke-dasharray: 6 4; }
    .flow    { stroke: #d98a00; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>

  <text class="title" x="60" y="60">One VM = one Cloud Hypervisor process, one vCPU = one host thread</text>

  <!-- ===== Cloud Hypervisor processes (host user space) ===== -->
  <rect class="ch ghost" x="88" y="138" width="380" height="460" rx="14"/>
  <rect class="ch ghost" x="74" y="124" width="380" height="460" rx="14"/>
  <rect class="ch" x="60" y="110" width="380" height="460" rx="14"/>
  <text class="h" x="80" y="140" fill="#2a56b8">cloud-hypervisor process</text>
  <text class="sub" x="80" y="158">host user space</text>

  <!-- Non-vCPU threads: VMM control plane and device emulation -->
  <rect class="thread" x="90" y="175" width="320" height="36" rx="8"/>
  <text class="mono" x="106" y="198">vmm</text>
  <text class="sub" x="200" y="198">event loop, VM lifecycle</text>

  <rect class="thread" x="90" y="219" width="320" height="36" rx="8"/>
  <text class="mono" x="106" y="242">http-server</text>
  <text class="sub" x="200" y="242">REST API</text>

  <rect class="thread" x="90" y="263" width="320" height="36" rx="8"/>
  <text class="mono" x="106" y="286">virtio-*</text>
  <text class="sub" x="200" y="286">device worker threads</text>

  <line x1="90" y1="318" x2="410" y2="318" stroke="#3b6fd8" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- vCPU threads -->
  <rect class="vcpu" x="90" y="340" width="320" height="40" rx="8"/>
  <text class="mono" x="106" y="365">vcpu0</text>
  <rect class="vcpu" x="90" y="395" width="320" height="40" rx="8"/>
  <text class="mono" x="106" y="420">vcpu1</text>
  <rect class="vcpu" x="90" y="450" width="320" height="40" rx="8"/>
  <text class="mono" x="106" y="475">vcpu2</text>
  <rect class="vcpu" x="90" y="505" width="320" height="40" rx="8"/>
  <text class="mono" x="106" y="530">vcpu3</text>

  <!-- ===== KVM (host kernel) ===== -->
  <rect class="kvm" x="520" y="110" width="160" height="460" rx="14"/>
  <text class="h" x="600" y="140" text-anchor="middle" fill="#5b2fb0">KVM</text>
  <text class="sub" x="600" y="158" text-anchor="middle">host kernel</text>
  <text class="mono" x="600" y="190" text-anchor="middle">/dev/kvm</text>
  <text class="sub" x="600" y="250" text-anchor="middle">VM entry/exit,</text>
  <text class="sub" x="600" y="268" text-anchor="middle">hardware</text>
  <text class="sub" x="600" y="286" text-anchor="middle">virtualization</text>

  <!-- ===== Guest VMs ===== -->
  <rect class="vm ghost" x="788" y="138" width="380" height="460" rx="14"/>
  <rect class="vm ghost" x="774" y="124" width="380" height="460" rx="14"/>
  <rect class="vm" x="760" y="110" width="380" height="460" rx="14"/>
  <text class="h" x="780" y="140" fill="#1f7a45">Guest VM</text>
  <text class="sub" x="780" y="158">guest kernel view</text>

  <rect class="thread" x="800" y="175" width="300" height="124" rx="8"/>
  <text class="t" x="816" y="202">Guest OS</text>
  <text class="mono" x="816" y="236">$ nproc</text>
  <text class="mono" x="816" y="258">4</text>

  <!-- Guest CPUs, row-aligned with their backing host threads -->
  <rect class="vcpu" x="800" y="340" width="300" height="40" rx="8"/>
  <text class="t" x="816" y="365">CPU 0</text>
  <rect class="vcpu" x="800" y="395" width="300" height="40" rx="8"/>
  <text class="t" x="816" y="420">CPU 1</text>
  <rect class="vcpu" x="800" y="450" width="300" height="40" rx="8"/>
  <text class="t" x="816" y="475">CPU 2</text>
  <rect class="vcpu" x="800" y="505" width="300" height="40" rx="8"/>
  <text class="t" x="816" y="530">CPU 3</text>

  <!-- vCPU thread → KVM_RUN → guest CPU (drawn last so they sit on top of the KVM box) -->
  <path class="flow" d="M410,360 H798"/>
  <path class="flow" d="M410,415 H798"/>
  <path class="flow" d="M410,470 H798"/>
  <path class="flow" d="M410,525 H798"/>
  <text class="mono" x="600" y="352" text-anchor="middle">ioctl(KVM_RUN)</text>

  <!-- "more of these" hints below the stacked ghosts -->
  <text class="hint" x="250" y="630" text-anchor="middle">… one process per VM</text>
  <text class="hint" x="950" y="630" text-anchor="middle">… more VMs</text>
</svg>
