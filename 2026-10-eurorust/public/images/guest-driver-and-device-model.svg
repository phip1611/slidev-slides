<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'IBM Plex Sans', sans-serif">
  <style>
    .h     { font-size: 17px; font-weight: 600; fill: #242126; }
    .lh    { font-size: 16px; font-weight: 600; fill: #242126; }
    .sub   { font-size: 13px; fill: #706b6d; }
    .t     { font-size: 14px; fill: #242126; }
    .mono  { font-family: 'Source Code Pro', monospace; font-size: 13.5px; fill: #242126; }
    .monos { font-family: 'Source Code Pro', monospace; font-size: 12.5px; fill: #706b6d; }
    .badge-t { font-size: 13px; font-weight: 600; fill: #ffffff; }

    .guest { fill: #f3fbf6; stroke: #2f9e5b; stroke-width: 2; }
    .kvm   { fill: #f3ebff; stroke: #7c4dcc; stroke-width: 2; }
    .ch    { fill: #eaf1ff; stroke: #3b6fd8; stroke-width: 2; }
    .host  { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2; }
    .blk   { fill: #fff1d6; stroke: #d98a00; stroke-width: 2.5; }
    .net   { fill: #dff4f1; stroke: #0f8f80; stroke-width: 2.5; }
    .file  { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .pair-blk { stroke: #d98a00; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .pair-net { stroke: #0f8f80; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .io    { stroke: #9ca3af; stroke-width: 2; }
    .trap  { stroke: #8a0404; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); }
    .back  { stroke: #8a0404; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-red); }
    .badge { fill: #8a0404; }
  </style>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a0404"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- below the slide heading, aligned with the slide text -->
  <g transform="translate(19.4 68.5) scale(0.9685)">
    <!-- Layers -->
    <rect class="guest" x="60" y="110" width="840" height="110" rx="12"/>
    <text class="h"   x="80" y="140">Guest VM</text>
    <text class="sub" x="80" y="160">guest kernel</text>
    <rect class="kvm" x="60" y="240" width="840" height="50" rx="10"/>
    <text class="h"   x="80" y="262">KVM</text>
    <text class="sub" x="80" y="280">host kernel</text>
    <rect class="ch" x="60" y="310" width="840" height="110" rx="12"/>
    <text class="h"   x="80" y="340">cloud-hypervisor</text>
    <text class="sub" x="80" y="360">VMM, user space</text>
    <rect class="host" x="60" y="440" width="840" height="80" rx="12"/>
    <text class="h"   x="80" y="470">Host</text>
    <text class="sub" x="80" y="490">files and devices</text>

    <!-- Pairs: driver in the guest, device model in the VMM -->
    <line class="pair-blk" x1="430" y1="214" x2="430" y2="349"/>
    <line class="pair-net" x1="740" y1="218" x2="740" y2="353"/>
    <line class="io" x1="430" y1="400" x2="430" y2="455"/>
    <line class="io" x1="740" y1="400" x2="740" y2="455"/>

    <path class="blk" d="M299,135 H561 A9,9 0 0 1 570,144 V191 A9,9 0 0 1 561,200 H466 L454,214 L442,200 L430,214 L418,200 L406,214 L394,200 H299 A9,9 0 0 1 290,191 V144 A9,9 0 0 1 299,135 Z"/>
    <text class="lh"    x="430" y="163" text-anchor="middle">Block device driver</text>
    <text class="monos" x="430" y="185" text-anchor="middle">e.g. virtio-blk</text>
    <path class="net" d="M609,135 H871 A9,9 0 0 1 880,144 V191 A9,9 0 0 1 871,200 H758 A18,18 0 0 1 722,200 H609 A9,9 0 0 1 600,191 V144 A9,9 0 0 1 609,135 Z"/>
    <text class="lh"    x="740" y="163" text-anchor="middle">Network device driver</text>
    <text class="monos" x="740" y="185" text-anchor="middle">e.g. virtio-net</text>

    <path class="blk" d="M299,335 H394 L406,349 L418,335 L430,349 L442,335 L454,349 L466,335 H561 A9,9 0 0 1 570,344 V391 A9,9 0 0 1 561,400 H299 A9,9 0 0 1 290,391 V344 A9,9 0 0 1 299,335 Z"/>
    <text class="lh"  x="430" y="373" text-anchor="middle">Block device model</text>
    <text class="sub" x="430" y="392" text-anchor="middle">emulates the device</text>
    <path class="net" d="M609,335 H722 A18,18 0 0 0 758,335 H871 A9,9 0 0 1 880,344 V391 A9,9 0 0 1 871,400 H609 A9,9 0 0 1 600,391 V344 A9,9 0 0 1 609,335 Z"/>
    <text class="lh"  x="740" y="373" text-anchor="middle">Network device model</text>
    <text class="sub" x="740" y="392" text-anchor="middle">emulates the device</text>

    <rect class="file" x="290" y="455" width="280" height="50" rx="8"/>
    <text class="mono" x="430" y="476" text-anchor="middle">disk.img</text>
    <text class="sub"  x="430" y="495" text-anchor="middle">disk image file</text>
    <rect class="file" x="600" y="455" width="280" height="50" rx="8"/>
    <text class="mono" x="740" y="476" text-anchor="middle">tap0</text>
    <text class="sub"  x="740" y="495" text-anchor="middle">tap device</text>

    <!-- Explanation -->
    <text class="h" x="930" y="140">Driver ↔ device model</text>
    <text class="t" x="930" y="166">Each driver in the guest</text>
    <text class="t" x="930" y="186">talks to its counterpart:</text>
    <text class="t" x="930" y="206">a device model in the VMM.</text>
    <text class="t" x="930" y="232">Both speak the same</text>
    <text class="t" x="930" y="252">device interface.</text>

    <!-- One block access -->
    <line class="trap" x1="360" y1="200" x2="360" y2="238"/>
    <line class="trap" x1="360" y1="290" x2="360" y2="333"/>
    <line class="trap" x1="360" y1="400" x2="360" y2="453"/>
    <line class="back" x1="500" y1="335" x2="500" y2="202"/>
    <circle class="badge" cx="337" cy="219" r="11"/>
    <text class="badge-t" x="337" y="223.5" text-anchor="middle">1</text>
    <circle class="badge" cx="360" cy="265" r="11"/>
    <text class="badge-t" x="360" y="269.5" text-anchor="middle">2</text>
    <circle class="badge" cx="337" cy="312" r="11"/>
    <text class="badge-t" x="337" y="316.5" text-anchor="middle">3</text>
    <circle class="badge" cx="337" cy="428" r="11"/>
    <text class="badge-t" x="337" y="432.5" text-anchor="middle">4</text>
    <circle class="badge" cx="500" cy="265" r="11"/>
    <text class="badge-t" x="500" y="269.5" text-anchor="middle">5</text>

    <text class="h" x="930" y="310">One block access</text>
    <circle class="badge" cx="941" cy="330" r="11"/>
    <text class="badge-t" x="941" y="334.5" text-anchor="middle">1</text>
    <text class="t" x="960" y="335">driver accesses a</text>
    <text class="t" x="960" y="354">device register</text>
    <circle class="badge" cx="941" cy="370" r="11"/>
    <text class="badge-t" x="941" y="374.5" text-anchor="middle">2</text>
    <text class="t" x="960" y="375">VM exit: trap</text>
    <text class="t" x="960" y="394">into KVM</text>
    <circle class="badge" cx="941" cy="410" r="11"/>
    <text class="badge-t" x="941" y="414.5" text-anchor="middle">3</text>
    <text class="t" x="960" y="415"><tspan class="mono">KVM_RUN</tspan> returns</text>
    <text class="t" x="960" y="434">to the VMM</text>
    <circle class="badge" cx="941" cy="450" r="11"/>
    <text class="badge-t" x="941" y="454.5" text-anchor="middle">4</text>
    <text class="t" x="960" y="455">device model does</text>
    <text class="t" x="960" y="474">the I/O on disk.img</text>
    <circle class="badge" cx="941" cy="490" r="11"/>
    <text class="badge-t" x="941" y="494.5" text-anchor="middle">5</text>
    <text class="t" x="960" y="495">VM entry: guest</text>
    <text class="t" x="960" y="514">continues</text>
  </g>
</svg>
