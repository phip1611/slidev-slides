<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'IBM Plex Sans', sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 600; fill: #8a0404; letter-spacing: -0.035em; }
    .lead  { font-size: 15px; fill: #706b6d; }
    .band-h { font-size: 17px; font-weight: 600; fill: #242126; }
    .h     { font-size: 17px; font-weight: 600; fill: #242126; }
    .sub   { font-size: 13.5px; fill: #706b6d; }
    .mono  { font-family: 'Source Code Pro', monospace; font-size: 14px; fill: #242126; }
    .t     { font-size: 15px; fill: #242126; }

    .band  { fill: #fbfaf9; stroke: #e6e1df; stroke-width: 1.5; }
    .app   { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; }
    .ch    { fill: #eaf1ff; stroke: #3b6fd8; stroke-width: 2; }
    .vm    { fill: #e9f7ef; stroke: #2f9e5b; stroke-width: 2; }
    .kvm   { fill: #f3ebff; stroke: #7c4dcc; stroke-width: 2; }
    .hw    { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; }
    .link  { stroke: #242126; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#242126"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>

  <text class="title" x="60" y="62">2.6 Cloud Hypervisor and KVM</text>
  <text class="lead"  x="60" y="88">The VMM is a user-space application - KVM is the privileged part in the kernel</text>

  <!-- User space -->
  <rect class="band" x="60" y="108" width="1080" height="190" rx="12"/>
  <text class="band-h" x="80" y="138">User space</text>
  <text class="sub"    x="80" y="158">unprivileged</text>

  <rect class="app" x="260" y="170" width="160" height="80" rx="10"/>
  <text class="mono" x="340" y="215" text-anchor="middle">firefox</text>
  <rect class="app" x="440" y="170" width="160" height="80" rx="10"/>
  <text class="mono" x="520" y="215" text-anchor="middle">rustc</text>

  <rect class="ch" x="640" y="124" width="480" height="158" rx="12"/>
  <text class="h"   x="664" y="152" fill="#2a56b8">cloud-hypervisor</text>
  <text class="sub" x="664" y="172">VMM - a normal process, one per VM</text>
  <rect class="vm"  x="664" y="186" width="432" height="76" rx="10"/>
  <text class="h"   x="688" y="216" fill="#1f7a44">Guest VM</text>
  <text class="sub" x="688" y="238">its own kernel and apps, e.g. Linux or Windows</text>

  <!-- Kernel space -->
  <rect class="band" x="60" y="318" width="1080" height="132" rx="12"/>
  <text class="band-h" x="80" y="348">Kernel space</text>
  <text class="sub"    x="80" y="368">privileged</text>

  <rect class="app" x="260" y="334" width="860" height="100" rx="10"/>
  <text class="h"   x="284" y="366">Linux kernel</text>
  <text class="sub" x="284" y="388">scheduler, memory, drivers, file systems</text>

  <rect class="kvm" x="800" y="348" width="296" height="72" rx="10"/>
  <text class="h"   x="824" y="378" fill="#5b2fa8">KVM</text>
  <text class="sub" x="824" y="400">kernel module behind /dev/kvm</text>

  <!-- VMM uses KVM -->
  <line class="link" x1="948" y1="282" x2="948" y2="346"/>
  <text class="mono" x="962" y="312">ioctl()¹</text>

  <!-- Hardware -->
  <rect class="hw" x="60" y="468" width="1080" height="44" rx="10"/>
  <text class="t" x="600" y="496" text-anchor="middle">Hardware: CPU with virtualization extensions (Intel VMX, AMD SVM)</text>
</svg>
